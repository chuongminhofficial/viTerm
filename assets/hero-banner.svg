<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C12"/>
      <stop offset="55%" stop-color="#0E1520"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 170) rotate(20) scale(360 180)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 150) rotate(-15) scale(320 180)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="logoClip">
      <rect x="64" y="92" width="112" height="112" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="17.25" stroke="#233042" stroke-width="1.5"/>

  <!-- Official viTerm Mark -->
  <g clip-path="url(#logoClip)">
    <rect x="64" y="92" width="112" height="112" fill="#181C24"/>
    <circle cx="81" cy="115" r="89" fill="#212121"/>
    <path d="M78 106 L100 128 L78 150" stroke="#00BF63" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="100" y1="158" x2="136" y2="158" stroke="#00BF63" stroke-width="7.5" stroke-linecap="round"/>
  </g>
  <rect x="64" y="92" width="112" height="112" rx="22" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Top Pill -->
  <rect x="206" y="76" width="292" height="28" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.38"/>
  <circle cx="222" cy="90" r="4" fill="#10B981"/>
  <text x="234" y="94" fill="#34D399" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.8">v2.8.0 - CHUONG MINH STUDIO</text>

  <!-- Title & Subtitle -->
  <text x="206" y="156" fill="#F8FAFC" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">viTerm</text>
  <text x="394" y="156" fill="#10B981" font-family="Consolas, 'JetBrains Mono', monospace" font-size="28" font-weight="700">//MONO</text>
  <text x="206" y="192" fill="#CBD5E1" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18.5" font-weight="500">
    Native Rust SSH, Dual-Pane SFTP, Smart 1+2 / 2x2 Split Terminal &amp; AI DevOps Workspace
  </text>

  <!-- Feature Badges Row (Pure Typography, No Emojis) -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700">
    <rect x="206" y="218" width="146" height="32" rx="6" fill="#131A26" stroke="#263348"/>
    <text x="220" y="238" fill="#E2E8F0">TAURI v2 + RUST</text>

    <rect x="362" y="218" width="166" height="32" rx="6" fill="#131A26" stroke="#263348"/>
    <text x="376" y="238" fill="#E2E8F0">AUTO-OFF TELEX/VNI</text>

    <rect x="538" y="218" width="132" height="32" rx="6" fill="#131A26" stroke="#263348"/>
    <text x="552" y="238" fill="#E2E8F0">AES-256-GCM</text>

    <rect x="680" y="218" width="194" height="32" rx="6" fill="#131A26" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="694" y="238" fill="#34D399">SIGNED SHA-256 + TSA</text>
  </g>

  <!-- Right Mini Terminal Preview Card -->
  <g transform="translate(925, 62)">
    <rect width="220" height="216" rx="10" fill="#0B0F17" stroke="#243247" stroke-width="1.2"/>
    <rect width="220" height="28" rx="10" fill="#121824"/>
    <rect y="18" width="220" height="10" fill="#121824"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444"/>
    <circle cx="30" cy="14" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="14" r="4" fill="#10B981"/>
    <text x="60" y="18" fill="#94A3B8" font-family="Consolas, monospace" font-size="10">root@prod-node: ~</text>

    <text x="14" y="52" fill="#34D399" font-family="Consolas, monospace" font-size="11">$ ssh prod-api</text>
    <text x="14" y="72" fill="#94A3B8" font-family="Consolas, monospace" font-size="10.5">[OK] Connected (11ms)</text>
    <text x="14" y="94" fill="#38BDF8" font-family="Consolas, monospace" font-size="11">$ docker ps --stat</text>
    <text x="14" y="114" fill="#E2E8F0" font-family="Consolas, monospace" font-size="10">nginx-edge   Up 29d</text>
    <text x="14" y="130" fill="#E2E8F0" font-family="Consolas, monospace" font-size="10">postgres-ha  Up 48d</text>
    <text x="14" y="146" fill="#E2E8F0" font-family="Consolas, monospace" font-size="10">redis-cache  Up 48d</text>
    <rect x="14" y="166" width="192" height="34" rx="5" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35"/>
    <text x="24" y="181" fill="#34D399" font-family="Consolas, monospace" font-size="9.5" font-weight="700">IME GUARD: EN (NO TELEX)</text>
    <text x="24" y="194" fill="#94A3B8" font-family="Consolas, monospace" font-size="9">SPLIT: 1+2 / 2x2 | LOCAL-FIRST</text>
  </g>
</svg>
